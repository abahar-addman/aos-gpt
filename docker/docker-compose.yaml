services:
  edison-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Hosted under https://aos.addmangroup.com/edison-ai/ behind a prefix-stripping
        # proxy. Must match WEBUI_BASE_PATH in .env.production. Override to "" for root.
        BASE_PATH: ${BASE_PATH-/edison-ai}
    image: addmangroup/edison-ai:latest
    container_name: edison-ai
    volumes:
      - edison-ai:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-1776}:1776
    env_file:
      - ../.env.production
    environment:
      # Defaults (only used if not set in .env)
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN-*}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS-*}
      - SCARF_NO_ANALYTICS=${SCARF_NO_ANALYTICS-true}
      - DO_NOT_TRACK=${DO_NOT_TRACK-true}
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  edison-ai: {}


# This compose builds/pushes ONLY the app image (addmangroup/edison-ai).
# Pipelines is hosted independently and lives in docker-compose.pipelines.yaml,
# so the commands below never rebuild or overwrite the live pipelines image.
#
# Usage:
#   Build locally:  docker compose -f docker/docker-compose.yaml build
#   Push to hub:    docker compose -f docker/docker-compose.yaml push
#   Build & push:   docker compose -f docker/docker-compose.yaml build && docker compose -f docker/docker-compose.yaml push
#   Run:            docker compose -f docker/docker-compose.yaml up -d
#
# Run the full stack (app + pipelines) locally:
#   docker compose -f docker/docker-compose.yaml -f docker/docker-compose.pipelines.yaml up -d
